[project]
name = "target-googleads"
version = "0.1.0"
description = "`target-googleads` is a Singer target for GoogleAds, built with the Meltano SDK for Singer Targets."
authors = [{ name = "Hotglue", email = "hello@hotglue.io" }]
keywords = [
    "ELT",
    "googleads",
]
license = "Apache-2.0"
requires-python = "<3.11,>=3.7.1"
dependencies = [
    "requests>=2.25.1",
    "hotglue-singer-sdk>=1.0.11",
]

[project.scripts]
target-googleads = 'target_googleads.target:TargetGoogleAds.cli'

[dependency-groups]
dev = [
    "pytest>=7",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100
required-version = ">=0.15"

[tool.ruff.lint]
future-annotations = true
ignore = [
    "COM812",
    "FIX002",
    "TD002",
    "TD003",
]
select = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
]
"target_googleads/client.py" = [
    "ANN401",
    "D102",
    "I001",
]
"target_googleads/sinks.py" = [
    "D102",
    "I001",
]
"target_googleads/target.py" = [
    "RUF012",
    "I001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.tox]
env_list = ["lint"]
requires = ["tox>=4", "tox-uv>=1"]

[tool.tox.env.lint]
description = "Run ruff check and format"
skip_install = true
deps = ["ruff>=0.15"]
commands = [
    ["ruff", "check", "target_googleads", "tests"],
    ["ruff", "format", "--check", "target_googleads", "tests"],
]

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"
